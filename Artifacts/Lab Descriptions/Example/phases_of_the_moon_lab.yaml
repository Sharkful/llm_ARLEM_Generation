topic_name: phases_of_the_moon
field: astronomy
course_context: "Introduction to Astronomy, 100-level undergraduate non-majors course"

topic_description: |
  An exploration of the phases of the Moon. Students will see how the Moon's
  appearance changes as it orbits Earth, and understand that phases are caused
  by the changing angle between the Sun, Earth, and Moon rather than by Earth's
  shadow. The lab covers the relative sizes and distances of the Earth-Moon
  system, synchronous rotation, and how the same phase looks different depending
  on whether you're viewing from Earth, from the Moon, or from above the
  Earth's north pole.

learning_objectives:
  - "Students will identify the eight named phases of the Moon in sequence."
  - "Students will explain that lunar phases result from the geometry of the Sun-Earth-Moon system, not from Earth's shadow."
  - "Students will describe synchronous rotation and explain why the same side of the Moon always faces Earth."
  - "Students will recognize the relative scale of the Earth-Moon system, including diameters and orbital distance."
  - "Students will predict the appearance of the Moon from different vantage points (Earth, Moon, above the pole)."

detailed_script: |
  The lab opens with a scale model of the Earth-Moon system. Students see
  Earth (8,000 miles in diameter) and the Moon (2,000 miles in diameter, about
  one-quarter Earth's size) at correct relative scale, with labels showing
  these diameters and the 240,000-mile distance between them. Narration walks
  through what these numbers mean — the gap between Earth and Moon could fit
  roughly thirty Earths lined up end to end. At a 1 inch = 1,000 miles scale,
  the Sun would sit about 270 feet away.

  Next, a synchronous rotation module. The Moon orbits Earth on a roughly
  28-day cycle while a small figure stands on the Moon's surface, always
  facing Earth. Students step through positions at New Moon, Waxing Crescent
  (3.5 days), First Quarter (7 days), Waxing Gibbous (11.5 days), Full Moon
  (14 days), Waning Gibbous (17.5 days), Third Quarter (21 days), and Waning
  Crescent (24.5 days). At each position the figure's orientation relative to
  Earth stays fixed while its orientation relative to the Sun rotates. The
  lab handout asks students to sketch the figure at each phase.

  Two viewpoint modules follow. First, the Moon's appearance as seen from
  Earth at each of the eight phases. Second, Earth's appearance as seen from
  the Moon — "Earth phases" — which run opposite to Moon phases (when the
  Moon is New from Earth, Earth is Full from the Moon). Students step through
  both at their own pace and sketch what they observe.

  A fourth viewpoint module shows the system from above Earth's north pole —
  the textbook-diagram view that students have seen in 2D but rarely in 3D.
  Students sketch the shadow patterns on both bodies from this angle.

  The lab then transitions to an embodied activity. A basketball represents
  the Moon, the user's head represents Earth, and a virtual Sun is fixed at
  a known direction in the scene. Students rotate the basketball to each
  phase position; the system checks whether the angle to the Sun is within
  30 degrees of the target (0° for New, 45° for Waxing Crescent, 90° for
  First Quarter, 135° for Waxing Gibbous, 180° for Full, 225° for Waning
  Gibbous, 270° for Third Quarter, 315° for Waning Crescent). After a guided
  pass through all eight phases in order, a challenge module asks students
  to reproduce phases in a randomized sequence.

  The lab closes with a recap screen listing the six concept areas covered,
  highlighting each one as the narration reviews it.
