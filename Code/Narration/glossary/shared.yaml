# Shared glossary for the spoken-form rules (#94). Used for every lab.
#
# Only pronunciation lives here: what a term or symbol sounds like. A term's
# meaning only matters when it changes how it is said, and those cases go under
# "senses", decided by clue words found in the lab itself, so this file works for
# topics we have never seen. Topic files (topics/<topic>.yaml) and a run folder's
# glossary.yaml can add to or override any entry, and pin a sense.
#
# Status: reviewed by @Sharkful (2026-11-05, #94). Built from the wave-2 narration
# (1,790 clips, five topics) plus general science notation.
version: 1

# Acronyms and other terms, matched exactly (case-sensitive), also with a plural
# "s" or "'s". An empty value means "known: the voice reads it as written"; such a
# term is never flagged. A value is what is said instead.
terms:
  VSEPR: vesper          # said as a word; voices spell or mangle it ("vee-sepper")
  # Known initialisms, read letter by letter as written:
  DNA:
  RNA:
  mRNA:
  tRNA:
  ATP:
  ADP:
  SSB:                   # single-strand binding protein
  AV:                    # atrioventricular
  SA:                    # sinoatrial (node)
  ECG:
  EKG:
  CO:                    # cardiac output, or carbon monoxide: both said "C O"
  AU:                    # astronomical unit (after a number, see units) or gold
  AR:
  VR:
  LED:                   # light-emitting diode: L E D, never the word "led"
  NOT: not               # emphasis ("Do NOT touch"): too short for the emphasis rule
  UI:
  EDG:                   # electron-domain geometry
  ID:
  PCR:
  pH: P H

# Units: said only right after a number ("5 mm" -> "5 millimeters", "1 mm" -> "1
# millimeter"), or as a compound on its own ("in m/s"). A unit with "cues" is used
# only when the lab mentions one of those words anywhere: single capital letters
# are too easy to confuse with labels ("2 C atoms") otherwise. Glued to a number
# ("5mm") is fine for units of two or more characters.
units:
  nm: [nanometer, nanometers]
  µm: [micrometer, micrometers]
  μm: [micrometer, micrometers]
  mm: [millimeter, millimeters]
  cm: [centimeter, centimeters]
  m: [meter, meters]
  km: [kilometer, kilometers]
  ft: [foot, feet]
  mi: [mile, miles]
  AU: [astronomical unit, astronomical units]
  ly: [light-year, light-years]
  pc: {say: [parsec, parsecs], cues: [parsec, parsecs, star, stars, galaxy, astronomy]}
  mg: [milligram, milligrams]
  µg: [microgram, micrograms]
  g: [gram, grams]
  kg: [kilogram, kilograms]
  ms: [millisecond, milliseconds]
  s: [second, seconds]
  min: [minute, minutes]
  h: [hour, hours]
  hr: [hour, hours]
  yr: [year, years]
  mL: [milliliter, milliliters]
  ml: [milliliter, milliliters]
  µL: [microliter, microliters]
  L: [liter, liters]
  K: {say: [kelvin, kelvin], cues: [kelvin, temperature]}
  mph: [mile per hour, miles per hour]
  N: {say: [newton, newtons], cues: [newton, newtons]}
  J: {say: [joule, joules], cues: [joule, joules]}
  kJ: [kilojoule, kilojoules]
  cal: [calorie, calories]
  kcal: [kilocalorie, kilocalories]
  W: {say: [watt, watts], cues: [watt, watts]}
  kW: [kilowatt, kilowatts]
  Pa: [pascal, pascals]
  kPa: [kilopascal, kilopascals]
  atm: [atmosphere, atmospheres]
  mmHg: [millimeter of mercury, millimeters of mercury]
  Hz: [hertz, hertz]
  kHz: [kilohertz, kilohertz]
  MHz: [megahertz, megahertz]
  V: {say: [volt, volts], cues: [volt, volts, voltage, battery, circuit]}
  mV: [millivolt, millivolts]
  A: {say: [amp, amps], cues: [amp, amps, ampere, amperes, circuit]}
  mA: [milliamp, milliamps]
  Ω: [ohm, ohms]
  C: {say: [coulomb, coulombs], cues: [coulomb, coulombs]}
  T: {say: [tesla, teslas], cues: [tesla, teslas]}
  mol: [mole, moles]
  M: {say: [molar, molar], cues: [molar, molarity]}
  eV: [electron volt, electron volts]
  dB: [decibel, decibels]
  bpm: [beat per minute, beats per minute]
  rad: [radian, radians]

# Symbols. Letters (Greek) are said wherever they appear, also glued to a word
# ("cosθ" -> "cos theta"); other symbols are replaced with spaces around them.
# "=" (equals) and "+" (plus) are handled by the math rules, "°" and "%" by the
# number rules.
symbols:
  α: alpha
  β: beta
  γ: gamma
  δ: delta
  Δ: delta
  ε: epsilon
  η: eta
  θ: theta
  λ: lambda
  μ: mu
  ν: nu
  π: pi
  ρ: rho
  σ: sigma
  Σ: sigma
  τ: tau
  φ: phi
  ϕ: phi
  χ: chi
  ψ: psi
  ω: omega
  Ω: omega               # after a number it is the unit ohm (see units)
  "→": to
  "->": to
  "⟶": to
  "←": from
  "↔": to and from
  "⇌": is in equilibrium with
  "±": plus or minus
  "≈": approximately
  "~": about
  "×": times
  "·": times
  "÷": divided by
  "≠": does not equal
  "≤": is less than or equal to
  "≥": is greater than or equal to
  "<": is less than
  ">": is greater than
  "√": the square root of
  "∞": infinity
  "&": and
  "#": number

# Notation whose reading depends on what the lab is about. Each meaning lists
# clue words; the meaning with the most clue words anywhere in the lab (its id,
# course, object names and narration) wins. A tie or no clues leaves the notation
# as written and flags it. Strong local patterns always win: 5'10" is feet and
# inches, 23°26' is degrees and arcminutes, 5'→3' and "the 3' end" are primes.
senses:
  number_prime:          # 5', 3'
    prime:
      say: prime
      cues: [strand, strands, dna, rna, nucleotide, nucleotides, polymerase, ribose,
             deoxyribose, primer, primers, replication, transcription, sugar, helix,
             antiparallel, okazaki, codon, mrna, exon, intron]
    feet:
      say: [foot, feet]
      cues: [feet, foot, tall, height, inch, inches, ceiling, yard, yards]
    arcminutes:
      say: [arcminute, arcminutes]
      cues: [arcminute, arcminutes, arcsecond, arcseconds, declination, ascension,
             telescope, sky]
  axis_variable:         # Vx, vy, Ax: a letter with an axis subscript is said "V x"
    variable:
      say: variable
      cues: [axis, axes, component, components, vector, vectors, coordinate,
             coordinates, horizontal, vertical]
