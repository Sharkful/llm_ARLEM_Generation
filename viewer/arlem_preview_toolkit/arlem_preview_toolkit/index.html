<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ARLEM / Unity JSON Preview Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #111; color: white; }
    #ui {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      background: rgba(20,20,20,0.86); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px; padding: 12px; width: 380px; max-width: calc(100vw - 40px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    #ui h1 { font-size: 16px; margin: 0 0 8px; }
    #ui label { display:block; font-size: 12px; opacity: .9; margin-top: 8px; }
    #ui select, #ui input[type=file], #ui button {
      width: 100%; margin-top: 4px; box-sizing: border-box;
      background: #222; color: white; border: 1px solid #555; border-radius: 8px; padding: 7px;
    }
    #ui button { cursor: pointer; background: #2b4468; }
    #ui .row { display:flex; gap: 8px; align-items:center; margin-top: 8px; }
    #ui .row > * { flex: 1; }
    #ui .check { display:flex; gap:8px; align-items:center; font-size: 12px; margin-top: 8px; }
    #ui .check input { width: auto; }
    #info { font-size: 12px; opacity: .82; margin-top: 8px; line-height: 1.35; white-space: pre-wrap; max-height: 140px; overflow:auto; }
    #legend {
      position: fixed; right: 10px; bottom: 10px; z-index: 10;
      background: rgba(20,20,20,0.75); padding: 8px 10px; border-radius: 10px;
      font-size: 12px; color: #ddd;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>ARLEM / Unity JSON Preview</h1>
    <label>Load JSON file</label>
    <input id="fileInput" type="file" accept=".json,application/json" />

    <label>Module</label>
    <select id="moduleSelect"></select>

    <label>Clip / snapshot</label>
    <select id="clipSelect"></select>

    <div class="row">
      <button id="resetCam">Reset camera</button>
      <button id="topCam">Top-down view</button>
    </div>
    <div class="row">
      <button id="screenshot">Save screenshot</button>
    </div>

    <div class="check"><input id="showRoom" type="checkbox" checked /> <span>Show virtual room/grid</span></div>
    <div class="check"><input id="showLabels" type="checkbox" checked /> <span>Show object name labels</span></div>
    <div class="check"><input id="flipZ" type="checkbox" /> <span>Flip Z axis for right-handed/export view</span></div>

    <div id="info">Open a JSON file, then choose a module and clip.</div>
  </div>
  <div id="legend">Mouse: orbit • Wheel: zoom • Right-drag: pan</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let rawLab = null;
    let scene, camera, renderer, controls;
    let rootGroup, roomGroup;
    let objectMap = new Map();

    // GLB model cache: prefabName → THREE.Group (cloned per use)
    const glbCache = new Map();
    const _glbLoader = new GLTFLoader();

    function loadGlb(name) {
      if (glbCache.has(name)) {
        return Promise.resolve(glbCache.get(name) ? glbCache.get(name).clone() : null);
      }
      return new Promise(resolve => {
        _glbLoader.load(
          `assets/models/${name}.glb`,
          gltf => {
            glbCache.set(name, gltf.scene);
            resolve(gltf.scene.clone());
          },
          undefined,
          () => { glbCache.set(name, null); resolve(null); }
        );
      });
    }

    function classifyPrefab(name) {
      const p = (name || '').toLowerCase();
      if (p.includes('text'))                       return 'text';
      if (p.includes('sun'))                        return 'sun';
      if (p.includes('tiny'))                       return 'tinysphere';
      if (p.includes('robot'))                      return 'robot';
      if (p.includes('brb') || p.includes('button')) return 'button';
      if (p.includes('cube'))                       return 'cube';
      if (p.includes('plane'))                      return 'plane';
      if (p.includes('sphere') || p.includes('basketball') || p.includes('clickable') || p.includes('moveable')) return 'sphere';
      return 'box';
    }

    const moduleSelect = document.getElementById('moduleSelect');
    const clipSelect = document.getElementById('clipSelect');
    const info = document.getElementById('info');

    initThree();
    animate();

    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const text = await file.text();
      rawLab = JSON.parse(text);
      populateModules();
      renderSelected();
    });

    moduleSelect.addEventListener('change', () => { populateClips(); renderSelected(); });
    clipSelect.addEventListener('change', renderSelected);
    document.getElementById('showRoom').addEventListener('change', renderSelected);
    document.getElementById('showLabels').addEventListener('change', renderSelected);
    document.getElementById('flipZ').addEventListener('change', renderSelected);
    document.getElementById('resetCam').addEventListener('click', resetCamera);
    document.getElementById('screenshot').addEventListener('click', saveScreenshot);

    // Try to auto-load the included sample when served through a local web server.
    fetch('Optomized_moon_lab_final.json').then(r => r.ok ? r.json() : null).then(j => {
      if (j && !rawLab) { rawLab = j; populateModules(); renderSelected(); }
    }).catch(() => {});

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111318);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.01, 500);
      camera.position.set(4, 3, 7);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.4, 1.5);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 1.4);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(-10, 8, 4);
      scene.add(dir);

      rootGroup = new THREE.Group();
      scene.add(rootGroup);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function populateModules() {
      moduleSelect.innerHTML = '';
      rawLab.modules.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}: ${m.moduleName || '(untitled module)'}`;
        moduleSelect.appendChild(opt);
      });
      populateClips();
    }

    function populateClips() {
      clipSelect.innerHTML = '';
      const m = rawLab.modules[Number(moduleSelect.value)];
      const base = document.createElement('option');
      base.value = -1;
      base.textContent = 'Base object layout';
      clipSelect.appendChild(base);
      (m.clips || []).forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}: ${c.clipName || 'clip'}${c.audioClip ? ' / ' + c.audioClip : ''}`;
        clipSelect.appendChild(opt);
      });
    }

    function renderSelected() {
      if (!rawLab) return;
      rootGroup.clear();
      objectMap = new Map();

      if (document.getElementById('showRoom').checked) addRoom();

      const m = rawLab.modules[Number(moduleSelect.value)];
      const objects = deepClone(m.objects || []);
      const clipIndex = Number(clipSelect.value);

      if (clipIndex >= 0 && m.clips && m.clips[clipIndex]) {
        applyClipChanges(objects, m.clips[clipIndex]);
      }

      // Create placeholder groups first so parent-child references work.
      for (const obj of objects) {
        const group = new THREE.Group();
        group.name = obj.name || obj.prefab || 'object';
        objectMap.set(group.name, { group, data: obj });
      }

      // Attach groups to parents.
      for (const obj of objects) {
        const entry = objectMap.get(obj.name);
        const parentName = obj.parent;
        if (parentName && parentName !== '[CURRENT_LAB]' && objectMap.has(parentName)) {
          objectMap.get(parentName).group.add(entry.group);
        } else {
          rootGroup.add(entry.group);
        }
      }

      // Fill groups with geometry/text and apply transforms.
      for (const obj of objects) {
        const entry = objectMap.get(obj.name);
        applyTransform(entry.group, obj);
        addVisualForObject(entry.group, obj);
        if (document.getElementById('showLabels').checked && obj.prefab !== 'textPrefab') {
          addNameLabel(entry.group, obj.name || obj.prefab, obj);
        }
      }

      addAxesHelper();

      info.textContent =
        `Lab: ${rawLab.labId || '(unnamed)'}\n` +
        `Module: ${m.moduleName || '(untitled)'}\n` +
        `Objects: ${(m.objects || []).length}\n` +
        `Clips: ${(m.clips || []).length}\n` +
        `Selected: ${clipIndex >= 0 ? (m.clips[clipIndex].clipName || 'clip') : 'base layout'}\n` +
        `Textures expected in: assets/textures/<texture>.png|jpg`;
    }

    function applyClipChanges(objects, clip) {
      const byName = new Map(objects.map(o => [o.name, o]));
      for (const change of (clip.changes || [])) {
        const target = byName.get(change.target);
        if (!target) continue;
        for (const k of Object.keys(change)) {
          if (k === 'target') continue;
          if (k === 'components') {
            target.components = mergeComponents(target.components || [], change.components || []);
          } else {
            target[k] = deepClone(change[k]);
          }
        }
      }
    }

    function mergeComponents(base, changes) {
      const out = deepClone(base);
      for (const c of changes) {
        const idx = out.findIndex(x => x.componentType === c.componentType);
        if (idx >= 0) out[idx] = { ...out[idx], ...c };
        else out.push(deepClone(c));
      }
      return out;
    }

    function applyTransform(group, obj) {
      const p = obj.position || [0,0,0];
      const s = obj.scale || [1,1,1];
      const e = obj.eulerAngles || [0,0,0];
      group.position.set(...mapPosition(p));
      group.scale.set(s[0] ?? 1, s[1] ?? 1, s[2] ?? 1);
      // Unity applies Euler rotations in ZXY order; Three.js defaults to XYZ.
      // Set order to 'ZXY' so the angles from the JSON produce the same result as Unity.
      group.rotation.order = 'ZXY';
      group.rotation.set(
        THREE.MathUtils.degToRad(e[0] ?? 0),
        THREE.MathUtils.degToRad(e[1] ?? 0),
        THREE.MathUtils.degToRad(e[2] ?? 0)
      );
    }

    function mapPosition(p) {
      const flipZ = document.getElementById('flipZ').checked;
      return [p[0] ?? 0, p[1] ?? 0, flipZ ? -(p[2] ?? 0) : (p[2] ?? 0)];
    }

    function addVisualForObject(group, obj) {
      const type = classifyPrefab(obj.prefab);

      if (type === 'text') {
        const text = getText(obj) || obj.name || '';
        const color = getColor(obj) || [255,255,255,255];
        const sprite = makeTextSprite(text, rgbaToCss(color), getFontSize(obj));
        sprite.scale.set(1.0, 1.0, 1.0);
        group.add(sprite);
        return;
      }

      // Phase A: add immediate placeholder mesh
      const placeholder = makePlaceholderMesh(type, obj);
      group.add(placeholder);
      if (placeholder.isMesh) {
        const outline = new THREE.BoxHelper(placeholder, 0xffffff);
        outline.material.transparent = true;
        outline.material.opacity = 0.22;
        group.add(outline);
      }

      // Phase B: attempt async GLB load; if found, swap out placeholder
      loadGlb(obj.prefab).then(model => {
        if (!model) return;
        // Remove placeholder mesh children (keep name labels which are added later)
        const toRemove = group.children.filter(c => c._isPlaceholder);
        toRemove.forEach(c => group.remove(c));
        model._isGlb = true;
        group.add(model);
      });
    }

    function makePlaceholderMesh(type, obj) {
      let mesh;
      switch (type) {
        case 'sun': {
          const g = new THREE.Group();
          g._isPlaceholder = true;
          const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 48, 24),
            new THREE.MeshStandardMaterial({ color: 0xffcc33, emissive: 0xffaa00, emissiveIntensity: 0.9 })
          );
          const light = new THREE.PointLight(0xfff0cc, 2.0, 80);
          g.add(sphere, light);
          return g;
        }
        case 'sphere': {
          const mat = new THREE.MeshStandardMaterial({ color: colorToHex(obj.color) ?? fallbackColor(obj), roughness: 0.8 });
          tryTexture(mat, obj.texture);
          mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 48, 24), mat);
          break;
        }
        case 'tinysphere':
          mesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 16, 8),
            new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.6 })
          );
          break;
        case 'robot':
          mesh = makeRobotPlaceholder();
          break;
        case 'button': {
          const g = new THREE.Group();
          g._isPlaceholder = true;
          const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07, 0.07, 0.15, 20),
            new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.4 })
          );
          const cap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.065, 0.065, 0.02, 20),
            new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.3 })
          );
          cap.position.y = 0.085;
          g.add(body, cap);
          return g;
        }
        case 'cube':
          mesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: colorToHex(obj.color) ?? fallbackColor(obj), roughness: 0.8 })
          );
          break;
        case 'plane':
          mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1),
            new THREE.MeshStandardMaterial({ color: colorToHex(obj.color) ?? fallbackColor(obj), roughness: 0.8, side: THREE.DoubleSide })
          );
          break;
        default:
          mesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: fallbackColor(obj), roughness: 0.8 })
          );
      }
      mesh._isPlaceholder = true;
      return mesh;
    }

    function makeRobotPlaceholder() {
      const g = new THREE.Group();
      g._isPlaceholder = true;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.8, 8, 16), new THREE.MeshStandardMaterial({ color: 0x7aa6ff, roughness: 0.6 }));
      body.rotation.z = Math.PI/2;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 24, 12), new THREE.MeshStandardMaterial({ color: 0xdde7ff, roughness: 0.5 }));
      head.position.x = 0.65;
      g.add(body, head);
      return g;
    }

    function addRoom() {
      roomGroup = new THREE.Group();

      const grid = new THREE.GridHelper(12, 24, 0x555555, 0x333333);
      grid.position.y = -1.0;
      roomGroup.add(grid);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.MeshStandardMaterial({ color: 0x22252c, side: THREE.DoubleSide, transparent: true, opacity: 0.32 })
      );
      floor.rotation.x = -Math.PI/2;
      floor.position.y = -1.01;
      roomGroup.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1b1e25, side: THREE.DoubleSide, transparent: true, opacity: 0.22 });
      const back = new THREE.Mesh(new THREE.PlaneGeometry(12, 4), wallMat);
      back.position.set(0, 1, 5);
      roomGroup.add(back);

      const side = new THREE.Mesh(new THREE.PlaneGeometry(12, 4), wallMat);
      side.position.set(-6, 1, 0);
      side.rotation.y = Math.PI/2;
      roomGroup.add(side);

      const human = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 1.35, 8, 16), new THREE.MeshStandardMaterial({ color: 0x999999, transparent:true, opacity:.75 }));
      human.position.set(-2.8, -0.15, 2.2);
      roomGroup.add(human);
      const label = makeTextSprite('1.7 m reference', 'white', 18);
      label.position.set(-2.8, 0.9, 2.2);
      label.scale.set(0.25, 0.25, 1);
      roomGroup.add(label);

      scene.add(roomGroup);
    }

    function addAxesHelper() {
      const axes = new THREE.AxesHelper(1.5);
      axes.position.set(-3, -0.95, -2.5);
      rootGroup.add(axes);
    }

    // Returns the cumulative uniform world scale walking up the parent chain from `group`.
    // Used to invert parent scaling so sprites appear at a constant world size.
    function getWorldScale(group) {
      if (!group) return 1;
      let s = 1;
      let node = group;
      while (node) {
        s *= (node.scale?.x ?? 1);
        node = node.parent;
      }
      return s || 1;
    }

    function addNameLabel(group, name, data) {
      const label = makeTextSprite(name, 'rgba(255,255,255,0.85)', 16);
      // Unity standard sphere has radius 0.5. Place label 0.6 local units above centre
      // (just clear of the surface). group.scale propagates this to world space.
      label.position.set(0, 0.6, 0);
      // Size the label so it reads as ~0.3 m wide in world space regardless of object scale.
      const worldScale = getWorldScale(group);
      label.scale.set(0.3 / worldScale, 0.3 / worldScale, 1);
      group.add(label);
    }

    function makeTextSprite(message, color='white', fontSize=22) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const lines = String(message).split('\n');
      const margin = 40;
      const maxWidth = canvas.width - margin * 2;
      // Start at the requested size and shrink until every line fits.
      let px = fontSize * 4;
      ctx.font = `${px}px system-ui, sans-serif`;
      while (px > 12 && lines.some(l => ctx.measureText(l).width > maxWidth)) {
        px -= 2;
        ctx.font = `${px}px system-ui, sans-serif`;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.fillStyle = color;
      const lineHeight = px * 1.2;
      const y0 = canvas.height/2 - lineHeight*(lines.length-1)/2;
      lines.forEach((line, i) => {
        ctx.strokeText(line, canvas.width/2, y0 + i*lineHeight);
        ctx.fillText(line, canvas.width/2, y0 + i*lineHeight);
      });
      const tex = new THREE.CanvasTexture(canvas);
      // Use a double-sided plane instead of Sprite so the text orientation is fixed
      // in world space and doesn't billboard to follow the camera.
      // Unity TMP at eulerAngles=0 faces -Z (toward a camera looking down +Z).
      // Three.js PlaneGeometry faces +Z by default, so flip the texture horizontally
      // to make the -Z face (back of the plane) show correct unmirrored text.
      tex.repeat.set(-1, 1);
      tex.offset.set(1, 0);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.BackSide });
      // Plane is 4 x 1 local units: canvas 1024x256 (4:1) matches this aspect ratio.
      return new THREE.Mesh(new THREE.PlaneGeometry(4, 1), mat);
    }

    function getText(obj) {
      const c = (obj.components || []).find(x => x.componentType === 'textMeshPro');
      return c ? c.text : null;
    }

    function getFontSize(obj) {
      const c = (obj.components || []).find(x => x.componentType === 'textMeshPro');
      return c ? 18 * (c.fontSize || 1) : 18;
    }

    function getColor(obj) {
      const c = (obj.components || []).find(x => x.componentType === 'textMeshPro');
      return c && c.color ? c.color : obj.color;
    }

    function colorToHex(c) {
      if (!c || c.length < 3) return null;
      const norm = c[0] <= 1 && c[1] <= 1 && c[2] <= 1;
      const r = norm ? Math.round(c[0]*255) : c[0];
      const g = norm ? Math.round(c[1]*255) : c[1];
      const b = norm ? Math.round(c[2]*255) : c[2];
      return (r << 16) + (g << 8) + b;
    }

    function rgbaToCss(c) {
      if (!c || c.length < 3) return 'white';
      const norm = c[0] <= 1 && c[1] <= 1 && c[2] <= 1;
      const r = norm ? Math.round(c[0]*255) : c[0];
      const g = norm ? Math.round(c[1]*255) : c[1];
      const b = norm ? Math.round(c[2]*255) : c[2];
      // Many legacy files use alpha=0 even when the label is meant to be seen; clamp low alpha upward.
      const aRaw = c.length > 3 ? (norm ? c[3] : c[3]/255) : 1;
      const a = Math.max(0.45, Math.min(1, aRaw || 1));
      return `rgba(${r},${g},${b},${a})`;
    }

    function fallbackColor(obj) {
      const prefab = (obj.prefab || '').toLowerCase();
      if ((obj.name || '').toLowerCase().includes('earth')) return 0x3d82ff;
      if ((obj.name || '').toLowerCase().includes('moon')) return 0xbfc4cc;
      if ((obj.name || '').toLowerCase().includes('basket')) return 0xd9822b;
      if (prefab.includes('tiny')) return 0xff3333;
      return 0xaaaaaa;
    }

    function tryTexture(mat, textureName) {
      if (!textureName) return;
      const loader = new THREE.TextureLoader();
      const candidates = [
        `assets/textures/${textureName}.png`,
        `assets/textures/${textureName}.jpg`,
        `assets/textures/${textureName}.jpeg`
      ];
      // Try the first candidate; if it fails silently the fallback color remains.
      loader.load(candidates[0], tex => { mat.map = tex; mat.needsUpdate = true; }, undefined, () => {
        loader.load(candidates[1], tex => { mat.map = tex; mat.needsUpdate = true; }, undefined, () => {
          loader.load(candidates[2], tex => { mat.map = tex; mat.needsUpdate = true; });
        });
      });
    }

    function resetCamera() {
      camera.position.set(4, 3, 7);
      controls.target.set(0, 0.4, 1.5);
      controls.update();
    }

    function saveScreenshot() {
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      const mod = moduleSelect.options[moduleSelect.selectedIndex]?.textContent?.replaceAll(/[^a-z0-9]+/gi,'_') || 'module';
      const clip = clipSelect.options[clipSelect.selectedIndex]?.textContent?.replaceAll(/[^a-z0-9]+/gi,'_') || 'clip';
      a.download = `arlem_preview_${mod}_${clip}.png`;
      a.click();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function deepClone(x) { return JSON.parse(JSON.stringify(x)); }
  </script>
</body>
</html>
