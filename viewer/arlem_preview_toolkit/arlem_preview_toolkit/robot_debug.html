<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Robot Debug</title>
  <style>body { margin: 0; background: #111; } canvas { display: block; }</style>
</head>
<body>
  <div style="position:fixed;top:10px;left:10px;color:white;font:14px monospace;background:rgba(0,0,0,0.7);padding:8px;border-radius:6px">
    <div id="status">Loading...</div>
    <div style="margin-top:6px;font-size:11px;opacity:.7">Orbit: left-drag &nbsp; Zoom: wheel</div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222233);

    const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.001, 100);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    //renderer.setSize(innerWidth, innerHeight);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(2, 4, 3);
    scene.add(dir);

    // Reference axes: red=X, green=Y, blue=Z
    scene.add(new THREE.AxesHelper(1));

    // Reference unit cube wireframe so we can see scale
    const box = new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(-0.5,-0.5,-0.5), new THREE.Vector3(0.5,0.5,0.5)), 0xffff00);
    scene.add(box);

    new GLTFLoader().load(
      'assets/models/robotIdle.glb',
      gltf => {
        const model = gltf.scene;

        // Measure raw size before any changes
        model.updateMatrixWorld(true);
        const rawBox = new THREE.Box3().setFromObject(model);
        const rawSize = new THREE.Vector3();
        rawBox.getSize(rawSize);
        const rawCenter = new THREE.Vector3();
        rawBox.getCenter(rawCenter);

        status.innerHTML =
          `Raw size: ${rawSize.x.toFixed(3)} x ${rawSize.y.toFixed(3)} x ${rawSize.z.toFixed(3)}<br>` +
          `Raw center: ${rawCenter.x.toFixed(3)}, ${rawCenter.y.toFixed(3)}, ${rawCenter.z.toFixed(3)}<br>` +
          `(yellow box = 1 unit cube for reference)`;

        // Center at origin — adjust scale below (1.0 = native size)
        model.position.x -= rawCenter.x;
        model.position.y -= rawCenter.y;
        model.position.z -= rawCenter.z; // also move up so feet are at y=0
        model.scale.setScalar(1.0);

        scene.add(model);
        window._model = model;
        window._THREE = THREE;
      },
      undefined,
      err => { status.textContent = 'ERROR: ' + err; }
    );

    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      //renderer.setSize(innerWidth, innerHeight);
      
      renderer.setSize(1.0, 1.0); // avoid resizing canvas if not needed (e.g. on mobile when address bar hides)
    });
  </script>
</body>
</html>
